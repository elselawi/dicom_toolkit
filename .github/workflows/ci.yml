name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Keep in sync with AGENTS.md ("Supported Android build matrix").
  FLUTTER_VERSION: 3.47.0
  AGP_8_VERSION: 8.13.1
  GRADLE_8_VERSION: 8.14
  NDK_VERSION: 28.2.13676358

jobs:
  analyze-and-test:
    name: Analyze, test, publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart analyze lib
      - run: flutter test
      - name: Publish dry-run
        run: flutter pub publish --dry-run

  example-agp9:
    name: Example app (Flutter 3.47 defaults: AGP 9.1.0 / Gradle 9.3.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Build the example app
        working-directory: example
        run: flutter build apk --debug

      - name: Assert the Rust library was packaged
        run: |
          unzip -l example/build/app/outputs/flutter-apk/app-debug.apk \
            | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libdicom_toolkit\.so'

  newdsl:
    name: AGP 10 readiness (android.newDsl=true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      # Flutter 3.47's own Gradle plugin cannot run with android.newDsl=true (it casts the
      # AGP extension to com.android.build.gradle.AbstractAppExtension, which the new DSL
      # does not implement), so the flag is exercised through a plain AGP app that applies a
      # stub Flutter plugin and depends on this package's android/ module. See the header of
      # the script for the full explanation.
      - name: Probe dicom_toolkit under android.newDsl=true
        run: dart run .github/scripts/agp_newdsl_probe.dart

      # Forward-looking check: once Flutter supports the new DSL, the example app must build
      # with the flag flipped. Until then, only the known Flutter-side blocker may fail it.
      - name: Example app with android.newDsl=true
        working-directory: example
        run: |
          set +e
          sed -i 's/^android.newDsl=false$/android.newDsl=true/' android/gradle.properties
          flutter build apk --debug 2>&1 | tee /tmp/newdsl-example.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::notice::The example app now builds with android.newDsl=true; Flutter's blocker is gone."
            exit 0
          fi
          if grep -q 'cannot be cast to class com.android.build.gradle.AbstractAppExtension' /tmp/newdsl-example.log; then
            echo "::warning::Known Flutter 3.47 blocker in FlutterPlugin.kt:354, not a dicom_toolkit failure."
            exit 0
          fi
          echo "::error::The example app failed with android.newDsl=true for an unexpected reason."
          exit 1

  agp8-consumer:
    name: Backward compatibility (AGP 8.13.1 / Gradle 8.14 / JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Scaffold a consumer app at Flutter's defaults, with this package as a path dependency
        run: |
          flutter create --platforms=android --org com.example consumer
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('consumer/pubspec.yaml')
          text = p.read_text()
          text = text.replace(
              "  cupertino_icons: ^1.0.8",
              "  cupertino_icons: ^1.0.8\n\n  dicom_toolkit:\n    path: ../",
          )
          p.write_text(text)
          PY

      - name: Pin AGP 8.13.1 and Gradle 8.14
        run: |
          sed -i -E 's/id\("com\.android\.application"\) version "[^"]+"/id("com.android.application") version "${{ env.AGP_8_VERSION }}"/' \
            consumer/android/settings.gradle.kts
          sed -i -E "s#gradle-[0-9.]+-all\.zip#gradle-${{ env.GRADLE_8_VERSION }}-all.zip#" \
            consumer/android/gradle/wrapper/gradle-wrapper.properties
          grep -n 'com.android.application' consumer/android/settings.gradle.kts

      - name: Build
        working-directory: consumer
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Build with every Gradle deprecation warning visible
        run: |
          set -o pipefail
          ./consumer/android/gradlew -p consumer/android :app:assembleDebug --warning-mode all --rerun-tasks 2>&1 \
            | tee /tmp/agp8.log

      # Scope: AGP deprecations only. The Gradle-10 deprecations that come from upstream
      # cargokit (`Task.project` at execution time) and from Flutter's own Gradle plugin
      # ("multi-string notation") are tracked separately and must not mask AGP regressions.
      - name: Fail on AGP deprecation warnings
        run: |
          if grep -nE "is obsolete and has been replaced|WARNING: The option setting 'android\.|of the Android Gradle plugin|has been removed\. Use" /tmp/agp8.log; then
            echo "::error::AGP emitted deprecation warnings; fix the plugin before publishing."
            exit 1
          fi
          echo "No AGP deprecation warnings."
