/// This is copied from Cargokit (which is the official way to use it currently)
/// Details: https://fzyzcjy.github.io/flutter_rust_bridge/manual/integrate/builtin
///
/// ---------------------------------------------------------------------------------------
/// LOCAL PATCH — this file is NOT identical to upstream any more. Do not blindly re-copy.
/// ---------------------------------------------------------------------------------------
///
/// Upstream:   https://github.com/fzyzcjy/cargokit — the maintained fork of the archived
///             https://github.com/irondash/cargokit. flutter_rust_bridge's `integrate`
///             backend vendors it as the git submodule
///             `frb_codegen/assets/integration_template/cargokit/plugin/cargokit`
///             (see the .gitmodules of fzyzcjy/flutter_rust_bridge).
/// Baseline:   the submodule revision shipped with flutter_rust_bridge 2.12.0. Diffing that
///             baseline against upstream main (fzyzcjy/cargokit@6f7144d192b04075acd73af2656cdebb1d3e4055,
///             the submodule pointer of fzyzcjy/flutter_rust_bridge master at the time of
///             writing) shows the upstream side already carries deviation A2
///             (`ExecOperations`) but still uses `project.buildDir` and the legacy variant
///             API — i.e. upstream main is *not* yet Gradle-9/AGP-10 clean.
///
/// Local deviations, so a future sync can rebase instead of re-copying:
///
///   Tier A — Gradle 9 compatibility (Gradle 9 removed `Project.buildDir` and `Project.exec`):
///     A1. `project.buildDir`     -> `project.layout.buildDirectory.get().asFile`
///     A2. `project.exec { }`     -> injected `org.gradle.process.ExecOperations`
///
///   Tier B — AGP 10 readiness, verified with `android.newDsl=true` (AGP 9 blocks the
///            legacy variant API, `android.sdkDirectory` and `AndroidSourceSet.jniLibs`
///            in the new DSL):
///     B1. `android.applicationVariants` / `android.libraryVariants` + `variants.all { }`
///         -> `androidComponents.onVariants { }` on this module
///     B2. `plugin.project.android.sdkDirectory`
///         -> `androidComponents.sdkComponents.sdkDirectory` (a provider)
///     B3. `plugin.project.android.compileSdkVersion.substring(8)`
///         -> `plugin.project.android.compileSdk`
///     B4. `plugin.project.android.defaultConfig.minSdkVersion.apiLevel`
///         -> `plugin.project.android.defaultConfig.minSdk`, falling back to the
///            resolved per-variant `variant.minSdk.apiLevel`
///     B5. `android.sourceSets.maybeCreate(buildType).jniLibs.srcDir(...)` plus the
///         `merge<BuildType>NativeLibs` hook
///         -> `variant.sources.jniLibs.addGeneratedSourceDirectory(...)`; AGP then owns the
///            ordering of the Rust build relative to the native-library merge.
///     B6. `CargoKitBuildTask.outputDir` became an `@OutputDirectory` `DirectoryProperty`
///         (required by `addGeneratedSourceDirectory`). The task is explicitly kept
///         always-out-of-date because the Rust sources are outside Gradle's model.
///
/// Tier A (deviations A1/A2) is exactly what upstream already did — when upstream main is
/// synced, only Tier B has to be re-applied on top.
/// ---------------------------------------------------------------------------------------

import java.nio.file.Paths
import javax.inject.Inject
import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.api.Action
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.tasks.OutputDirectory
import org.gradle.process.ExecOperations

CargoKitPlugin.file = buildscript.sourceFile

apply plugin: CargoKitPlugin

class CargoKitExtension {
    String manifestDir; // Relative path to folder containing Cargo.toml
    String libname; // Library name within Cargo.toml. Must be a cdylib
}

abstract class CargoKitBuildTask extends DefaultTask {

    // Gradle 9 removed `Project.exec`; process execution must go through the
    // `ExecOperations` service (deviation A2).
    @Inject
    abstract ExecOperations getExecOperations()

    @Input
    String buildMode

    @Input
    String buildDir

    // Deviation B6: `variant.sources.jniLibs.addGeneratedSourceDirectory` requires the
    // wired property to be a DirectoryProperty annotated with @OutputDirectory.
    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Input
    String ndkVersion

    @Input
    String sdkDirectory

    @Input
    int compileSdkVersion;

    @Input
    int minSdkVersion;

    @Input
    String pluginFile

    @Input
    List<String> targetPlatforms

    @TaskAction
    def build() {
        if (project.cargokit.manifestDir == null) {
            throw new GradleException("Property 'manifestDir' must be set on cargokit extension");
        }

        if (project.cargokit.libname == null) {
            throw new GradleException("Property 'libname' must be set on cargokit extension");
        }

        def executableName = Os.isFamily(Os.FAMILY_WINDOWS) ? "run_build_tool.cmd" : "run_build_tool.sh"
        def path = Paths.get(new File(pluginFile).parent, "..", executableName);

        def manifestDir = Paths.get(project.buildscript.sourceFile.parent, project.cargokit.manifestDir)

        def rootProjectDir = project.rootProject.projectDir

        if (!Os.isFamily(Os.FAMILY_WINDOWS)) {
            execOperations.exec {
                commandLine 'chmod', '+x', path
            }
        }

        execOperations.exec {
            executable path
            args "build-gradle"
            environment "CARGOKIT_ROOT_PROJECT_DIR", rootProjectDir
            environment "CARGOKIT_TOOL_TEMP_DIR", "${buildDir}/build_tool"
            environment "CARGOKIT_MANIFEST_DIR", manifestDir
            environment "CARGOKIT_CONFIGURATION", buildMode
            environment "CARGOKIT_TARGET_TEMP_DIR", buildDir
            environment "CARGOKIT_OUTPUT_DIR", outputDir.get().asFile.absolutePath
            environment "CARGOKIT_NDK_VERSION", ndkVersion
            environment "CARGOKIT_SDK_DIR", sdkDirectory
            environment "CARGOKIT_COMPILE_SDK_VERSION", compileSdkVersion
            environment "CARGOKIT_MIN_SDK_VERSION", minSdkVersion
            environment "CARGOKIT_TARGET_PLATFORMS", targetPlatforms.join(",")
            environment "CARGOKIT_JAVA_HOME", System.properties['java.home']
        }
    }
}

class CargoKitPlugin implements Plugin<Project> {

    static String file;

    private Plugin findFlutterPlugin(Project rootProject) {
        _findFlutterPlugin(rootProject.childProjects)
    }

   private Plugin _findFlutterPlugin(Map projects) {
        for (project in projects) {
            for (plugin in project.value.getPlugins()) {
                if (plugin.class.name == "com.flutter.gradle.FlutterPlugin" || plugin.class.name == "FlutterPlugin") {
                    return plugin;
                }
            }
            def plugin = _findFlutterPlugin(project.value.childProjects);
            if (plugin != null) {
                return plugin;
            }
        }
        return null;
    }

    @Override
    void apply(Project project) {
        def plugin = findFlutterPlugin(project.rootProject);

        project.extensions.create("cargokit", CargoKitExtension)

        if (plugin == null) {
            print("Flutter plugin not found, CargoKit plugin will not be applied.")
            return;
        }

        // Gradle 9 removed `Project.buildDir`; read the directory property instead
        // (deviation A1). Resolving it here is safe: the root build script redirects
        // `layout.buildDirectory` for every subproject during the root project's
        // evaluation, which always happens before this module is configured.
        def buildDirectory = project.layout.buildDirectory
        def cargoBuildDir = "${buildDirectory.get().asFile}/build"

        // The project the Flutter gradle plugin is applied to (the Android app). Its DSL is
        // where the Rust build has to read the NDK version, SDK location, compileSdk and
        // minSdk from.
        def appProject = plugin.project
        def appAndroid = appProject.extensions.getByName("android")

        // Deviation B2: `android.sdkDirectory` (a File) is blocked in AGP 9's new DSL.
        // `androidComponents.sdkComponents.sdkDirectory` is the provider-based replacement
        // and exists in AGP 8.11+ as well as AGP 9.
        def appSdkDirectory = appProject.extensions.getByName("androidComponents")
                .sdkComponents.sdkDirectory

        def List<String> platforms
        try {
            platforms = com.flutter.gradle.FlutterPluginUtils.getTargetPlatforms(project).collect()
        } catch (Exception ignored) {
            platforms = plugin.getTargetPlatforms().collect()
        }

        // Deviation B1: the legacy variant API (`applicationVariants`/`libraryVariants` and
        // `variants.all { }`) is blocked when `android.newDsl=true`. `androidComponents`
        // drives the same build types here; the Flutter gradle plugin only adds the extra
        // "profile" build type to the app project, never to plugin modules, so the set of
        // build types -- and therefore the set of tasks -- is unchanged.
        //
        // The Kotlin `onVariants(selector = ..., callback)` overload with a default argument
        // is not reachable from Groovy, hence the explicit selector and `Action` cast.
        def androidComponents = project.extensions.getByName("androidComponents")
        androidComponents.onVariants(androidComponents.selector(), { variant ->

            final buildType = variant.buildType

            def List<String> variantPlatforms = new ArrayList<>(platforms)
            // Same thing addFlutterDependencies does in flutter.gradle
            if (buildType == "debug") {
                variantPlatforms.add("android-x86")
                variantPlatforms.add("android-x64")
            }

            def libname = project.cargokit.libname
            if (libname == null) {
                throw new GradleException("Property 'libname' must be set on cargokit extension")
            }

            if (appAndroid.ndkVersion == null) {
                throw new GradleException("Please set 'android.ndkVersion' in 'app/build.gradle'.")
            }

            // Deviation B4: `minSdkVersion.apiLevel` is a legacy-DSL-only accessor. Prefer
            // the app's configured `defaultConfig.minSdk` so the Rust build still targets
            // the consumer's lowest supported API level, and fall back to the value AGP
            // resolved for this variant.
            def minSdk = appAndroid.defaultConfig.minSdk
            if (minSdk == null) {
                minSdk = variant.minSdk?.apiLevel
            }
            if (minSdk == null) {
                throw new GradleException("Could not determine minSdk; set 'android.defaultConfig.minSdk' in 'app/build.gradle'.")
            }

            def taskName = "cargokitCargoBuild${libname.capitalize()}${buildType.capitalize()}"

            // Deviation B6: `outputDir` is a DirectoryProperty so that it can be wired into
            // AGP's Sources API below.
            def task = project.tasks.register(taskName, CargoKitBuildTask.class) {
                buildMode = buildType
                buildDir = cargoBuildDir
                outputDir.set(buildDirectory.dir("jniLibs/${buildType}"))
                ndkVersion = appAndroid.ndkVersion
                sdkDirectory = appSdkDirectory.get().asFile.absolutePath
                minSdkVersion = minSdk as int
                // Deviation B3: `compileSdkVersion` (the "android-XX" string) is legacy-only.
                compileSdkVersion = appAndroid.compileSdk as int
                targetPlatforms = variantPlatforms
                pluginFile = CargoKitPlugin.file

                // The Rust sources are outside Gradle's input model, so up-to-date checks
                // cannot be trusted here -- cargokit's own crate-hash cache decides whether
                // cargo actually recompiles. This preserves the previous behaviour, where
                // the task always ran (upstream achieved the same with
                // `merge<BuildType>NativeLibs.outputs.upToDateWhen { false }`).
                outputs.upToDateWhen { false }
            }

            // Deviation B5: replaces
            //   android.sourceSets.maybeCreate(buildType).jniLibs.srcDir(...)
            //   (`AndroidSourceSet.jniLibs` is blocked in AGP 9's new DSL) and the
            //   `merge<BuildType>NativeLibs` hookup -- AGP now adds the task to the variant's
            //   jniLibs sources and orders it before the native-library merge itself.
            def jniLibs = variant.sources.jniLibs
            if (jniLibs == null) {
                throw new GradleException("AGP variant '${variant.name}' exposes no jniLibs source directory; cannot wire the cargo output into the AAR.")
            }
            jniLibs.addGeneratedSourceDirectory(task) { it.outputDir }
        } as Action)
    }
}
