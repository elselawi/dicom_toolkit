name: dicom_toolkit
description: "An advanced medical imaging and DICOM processing library for Flutter."
version: 0.3.0

repository: https://github.com/elselawi/dicom_toolkit
homepage: https://dicomtoolkit.pages.dev
license: GPL-3.0-only

topics:
  - dicom
  - medical-imaging
  - radiology
  - rust

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  # Pinned exactly. The generated bridge (lib/src/rust, rust/src/frb_generated.rs)
  # and rust/Cargo.toml are all stamped 2.12.0, and flutter_rust_bridge aborts
  # initialisation when the runtime version differs from the codegen version.
  # A caret range here resolves to the newest 2.x on a fresh `pub get`, which
  # breaks every consumer with:
  #   Bad state: dicom_toolkit's codegen version (2.12.0) should be the same as
  #   runtime version (2.13.0)
  flutter_rust_bridge: 2.12.0
dev_dependencies:
  ffi: ^2.1.3
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  #
  # Please refer to README.md for a detailed explanation.
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        pluginClass: DicomToolkitWeb
        fileName: dicom_toolkit_web.dart

  assets:
    - web/pkg/

  shaders:
    - assets/shaders/dicom_window.frag
